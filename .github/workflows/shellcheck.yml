name: shellcheck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: |
          shopt -s nullglob
          targets=(setup.sh uninstall.sh bin/* files/.bash_aliases files/.bashrc)
          # Filter to files that actually exist (some are added/removed per-branch).
          existing=()
          for f in "${targets[@]}"; do
            [ -f "$f" ] && existing+=("$f")
          done
          echo "Checking: ${existing[*]}"
          shellcheck "${existing[@]}"
        shell: bash
